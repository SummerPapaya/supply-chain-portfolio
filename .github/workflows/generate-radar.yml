name: Generate Supply Chain Radar

# Regenerates docs/radar-data.json (and the embedded fallback in docs/index.html)
# on a schedule so the "今日供应链雷达" refresh button always serves fresh data.
on:
  schedule:
    - cron: "13 */6 * * *"      # every 6 hours (UTC), offset to avoid the :00 stampede
  workflow_dispatch:            # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate radar data
        env:
          # Optional: set DEEPSEEK_API_KEY (or OPENAI_API_KEY) in repo Settings > Secrets
          # to translate English feeds into the Chinese (zh) field. Without it, the
          # feed text is passed through to both languages.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/generate_radar.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/radar-data.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update supply chain radar"
            git push
          fi
