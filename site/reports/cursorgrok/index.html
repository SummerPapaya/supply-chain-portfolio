  .wrap { max-width:1100px; margin:0 auto; padding:28px 20px 64px; }
  h1 { font-size:28px; margin:0 0 8px; }
  h2 { font-size:20px; margin:36px 0 14px; padding-top:8px; border-top:1px solid var(--line); }
  h3 { font-size:16px; margin:18px 0 10px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .btn,.pill,select { border:1px solid var(--line); background:#fff; color:var(--text); border-radius:999px; padding:8px 14px; font-size:14px; cursor:pointer; }
  select { border-radius:10px; }
  .btn.active,.pill.active { background:var(--blue); border-color:var(--blue); color:#fff; }
  .range { color:var(--muted); font-size:14px; margin:10px 0 0; }
  .callout { background:var(--soft); border:1px solid #bfdbfe; border-radius:12px; padding:12px 14px; color:#1e3a8a; font-size:14px; margin-top:12px; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  @media (max-width:900px){ .stats{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat .v { font-size:24px; font-weight:700; margin-bottom:6px; }
  .stat .l { font-size:13px; color:var(--muted); }
  .stat.success .v { color:var(--ok); } .stat.warning .v { color:var(--warn); } .stat.danger .v { color:var(--danger); } .stat.info .v { color:var(--info); }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  th { background:#f8fafc; color:var(--muted); font-weight:600; }
  tr:nth-child(even) td { background:#fafbfc; }
  .muted { color:var(--muted); font-size:13px; }
  .chart-box,.radar-box { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }
  .legend { display:flex; gap:16px; margin-top:8px; font-size:13px; }
  .legend .cn { color:var(--blue); } .legend .gl { color:var(--orange); }
  .sources a { color:var(--blue); }
  footer { margin-top:40px; color:var(--muted); font-size:13px; }

function el(tag, attrs={}, children=[]) {
  const node = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "className") node.className = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

function table(headers, rows) {
  const t = el("table");
  const thead = el("thead"); const hr = el("tr");
  headers.forEach(h => hr.appendChild(el("th", {}, h)));
  thead.appendChild(hr); t.appendChild(thead);
  const tb = el("tbody");
  rows.forEach(r => { const tr = el("tr"); r.forEach(c => tr.appendChild(el("td", {}, c))); tb.appendChild(tr); });
  t.appendChild(tb); return t;
}

function renderLineChart(container, categories, data, seriesName) {
  const w=900, h=280, pad={l:48,r:20,t:24,b:40};
  const max = Math.max(...data) * 1.15 || 1;
  const min = Math.min(0, Math.min(...data));
  const span = max - min || 1;
  const x = (i) => pad.l + (i * (w - pad.l - pad.r)) / Math.max(1, categories.length - 1);
  const y = (v) => pad.t + (1 - (v - min) / span) * (h - pad.t - pad.b);
  const pts = data.map((v,i) => `${x(i)},${y(v)}`).join(" ");
  let grid = "";
  for (let g=0; g<=4; g++) {
    const val = min + (span * g) / 4; const yy = y(val);
    grid += `<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#e2e8f0"/>`;
    grid += `<text x="${pad.l-8}" y="${yy+4}" text-anchor="end" fill="#64748b" font-size="11">${val.toFixed(1)}</text>`;
  }
  const labels = categories.map((c,i) => `<text x="${x(i)}" y="${h-12}" text-anchor="middle" fill="#64748b" font-size="11">${c}</text>`).join("");
  const dots = data.map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#2563eb"/>`).join("");
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="280" role="img" aria-label="${seriesName}">${grid}<polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="${pts}"/>${dots}${labels}<text x="${pad.l}" y="16" fill="#0f172a" font-size="12" font-weight="600">${seriesName}</text></svg>`;
}

function renderRadar(container, cnVals, glVals, lang) {
  const cx=260, cy=190, maxR=120, rings=[20,40,60,80,100];
  const toPoint = (idx, value) => {
    const angle = -Math.PI/2 + (idx * 2 * Math.PI) / RADAR_AXES.length;
    const r = (value/100)*maxR;
    return {x: cx + Math.cos(angle)*r, y: cy + Math.sin(angle)*r};
  };
  const poly = (values) => values.map((v,i)=>`${toPoint(i,v).x},${toPoint(i,v).y}`).join(" ");
  let svg = `<svg viewBox="0 0 520 380" width="100%" style="max-width:760px">`;
  rings.forEach(ring => {
    const pts = RADAR_AXES.map((_,i)=>{const p=toPoint(i,ring); return `${p.x},${p.y}`;}).join(" ");
    svg += `<polygon points="${pts}" fill="none" stroke="#cbd5e1" stroke-width="1"/>`;
  });
  RADAR_AXES.forEach((axis,i) => {
    const pEnd = toPoint(i,100), pLabel = toPoint(i,114);
    svg += `<line x1="${cx}" y1="${cy}" x2="${pEnd.x}" y2="${pEnd.y}" stroke="#cbd5e1"/>`;
    svg += `<text x="${pLabel.x}" y="${pLabel.y}" fill="#64748b" font-size="11" text-anchor="middle">${t(lang, axis)}</text>`;
  });
  svg += `<polygon points="${poly(cnVals)}" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="2.4"/>`;
  svg += `<polygon points="${poly(glVals)}" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-dasharray="5 4"/>`;
  svg += `</svg>`;
  container.innerHTML = svg;
}

  const metrics = document.getElementById("metrics"); metrics.innerHTML = "";
  getMetricCards(scope, period).forEach(c=>{
    metrics.appendChild(el("div", {className:"stat "+(c.tone||"neutral")}, [el("div",{className:"v"},c.value), el("div",{className:"l"},t(lang,c.label))]));
  });

  const dyn = document.getElementById("dynamics"); dyn.innerHTML = "";
  dyn.appendChild(table(lang==="zh"?["主题","本期观察","影响与含义"]:["Theme","What Happened","Implication"], rowsOf(lang, getDynamics(scope))));

  document.getElementById("chartTitle").textContent = scope==="cn"
    ? (lang==="zh"?"中国物流业景气指数（LPI）":"China Logistics Prosperity Index (LPI)")
    : (lang==="zh"?"全球供应链压力指数（GSCPI）":"Global Supply Chain Pressure Index (GSCPI)");
  document.getElementById("chartCaption").textContent = isArchive
    ? (lang==="zh"?"X轴=月份；Y轴=趋势分值（基准=100）。该窗口用于档案式趋势浏览。":"X-axis = month; Y-axis = trend score (baseline=100). This window is for archive-style trend browsing.")
    : scope==="cn"
      ? (lang==="zh"?"X轴=月份；Y轴=LPI（%）。来源：中物联，窗口内可得月度值。":"X-axis = month; Y-axis = LPI (%). Source: CFLP monthly releases within the selected window.")
      : (lang==="zh"?"X轴=月份；Y轴=GSCPI（点）。来源：纽约联储。":"X-axis = month; Y-axis = GSCPI (points). Source: Federal Reserve Bank of New York.");
  renderLineChart(document.getElementById("lineChart"), chart.categories, chart.data, scope==="cn"?"LPI":"GSCPI");

  const topics = document.getElementById("topics"); topics.innerHTML = "";
  topics.appendChild(table(lang==="zh"?["议题","窗口内信号","建议动作"]:["Topic","Signal in Window","Recommended Action"], rowsOf(lang, getTopics(scope))));

  const trends = document.getElementById("trends"); trends.innerHTML = "";
  trends.appendChild(table(lang==="zh"?["方向","趋势判断","执行建议"]:["Direction","Trend Assessment","Execution Advice"], TRENDS[lang]));

  document.getElementById("segIntro").textContent = lang==="zh"
    ? "点击品类查看细分结论，雷达图展示中国与全球在关键供应链能力上的相对对比。"
    : "Switch segment tabs to view deep dives. The radar compares China vs. global relative capabilities on key supply-chain dimensions.";
  const pills = document.getElementById("segPills"); pills.innerHTML = "";
  Object.keys(SPECIALTY_CONFIG).forEach(key=>{
    pills.appendChild(el("button", {className:"pill"+(state.specialtyTab===key?" active":""), type:"button", onClick:()=>{state.specialtyTab=key; render();}}, t(lang, SPECIALTY_CONFIG[key].title)));
  });
  const segStats = document.getElementById("segStats"); segStats.innerHTML = "";
  specialty.stats.forEach(c=>{
    segStats.appendChild(el("div", {className:"stat "+(c.tone||"neutral")}, [el("div",{className:"v"},c.value), el("div",{className:"l"},t(lang,c.label))]));
  });
  const segTable = document.getElementById("segTable"); segTable.innerHTML = "";
  segTable.appendChild(table(lang==="zh"?["模块","阶段观察","建议动作"]:["Module","Observed Pattern","Recommended Action"], rowsOf(lang, specialty.rows)));
  document.getElementById("radarTitle").textContent = lang==="zh"?"能力雷达图（中国 vs 全球）":"Capability Radar (China vs Global)";
  document.getElementById("radarCaption").textContent = lang==="zh"
    ? "图表说明：径向刻度为相对能力分值（0-100，越高代表相对成熟度越高）。"
    : "Chart note: radial scale is relative capability score (0-100, higher means stronger maturity).";
  renderRadar(document.getElementById("radar"), specialty.radar.cn, specialty.radar.global, lang);
  document.getElementById("legendCn").textContent = lang==="zh"?"中国（蓝色实线）":"China (Blue Solid Line)";
  document.getElementById("legendGl").textContent = lang==="zh"?"全球（橙色虚线）":"Global (Orange Dashed Line)";
  document.getElementById("segNote").innerHTML = `<strong>${t(lang, specialty.title)}</strong><br>${t(lang, specialty.note)}`;

  document.getElementById("sources").innerHTML = `<ol>
    <li><a href="https://www.newyorkfed.org/research/policy/gscpi" target="_blank" rel="noopener">Federal Reserve Bank of New York - GSCPI</a></li>
    <li><a href="https://www.wto.org/english/res_e/booksp_e/gtos0326_e.pdf" target="_blank" rel="noopener">WTO - Global Trade Outlook and Statistics (Mar 2026)</a></li>
    <li><a href="https://www.sse.net.cn/index/singleIndex?indexType=scfi" target="_blank" rel="noopener">Shanghai Shipping Exchange - SCFI</a></li>
    <li><a href="https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry" target="_blank" rel="noopener">Drewry - World Container Index</a></li>
    <li><a href="http://www.cflp.org.cn/" target="_blank" rel="noopener">China Federation of Logistics and Purchasing (LPI releases)</a></li>
  </ol>`;
  document.getElementById("footer").textContent = lang==="zh"
    ? "HTML 预览版 · 数据与结构来自 report.canvas.tsx · 本地打开即可审阅，无需构建。"
    : "HTML preview · content and structure from report.canvas.tsx · open locally, no build step.";
}

render();

</script>
