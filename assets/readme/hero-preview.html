<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply Chain Portfolio · Hero Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #101418; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    main { max-width: 948px; margin: 48px auto; padding: 0 24px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: 18px; }
    button { background: #101418; color: #f7f6f2; border: 0; border-radius: 7px; padding: 8px 13px; font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid #1a4fd6; outline-offset: 3px; }
    #hero { width: 100%; }
    #hero svg { display: block; width: 100%; height: auto; }
    .paused * { animation-play-state: paused !important; }
    p { color: #6e767f; margin: 20px 0 12px; }
    a { color: #1a4fd6; text-underline-offset: 4px; }
    .links { display: flex; gap: 22px; flex-wrap: wrap; }
    .mobile-proof { width: min(360px, 100%); margin-top: 30px; }
    .mobile-proof img { width: 100%; display: block; }
    body.dark { background: #0d1117; color: #e9edf2; }
    body.dark p { color: #9ba5b1; }
    body.dark a { color: #7ba3ff; }
    body.dark button { background: #e9edf2; color: #101418; }
    @media (max-width: 600px) { main { margin: 28px auto; padding: 0 16px; } header { align-items: flex-start; flex-wrap: wrap; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>双语 Hero / Bilingual Hero</h1>
      <div>
        <button id="motion" type="button" aria-pressed="false">暂停 / Pause</button>
        <button id="theme" type="button" aria-pressed="false">深色背景 / Dark</button>
      </div>
    </header>
    <div id="hero" aria-label="Supply Chain Intelligence · 全球供应链多模型洞察"></div>
    <p>8 秒循环：五路研究信息汇流 → 雷达扫描 → 来源确认 → 静止留白。标题始终可读。<br>8-second loop: research convergence → radar sweep → source confirmation → quiet hold.</p>
    <div class="links">
      <a href="hero-bilingual.svg" download>动画 SVG / Animated SVG</a>
      <a href="hero-bilingual-static.svg" download>静态备用版 / Static fallback</a>
    </div>
    <p>360px 缩略预览 / Mobile scale</p>
    <div class="mobile-proof"><img src="hero-bilingual-static.svg" width="360" height="180" alt="全球供应链多模型洞察：同一命题、五种 AI 视角、每周雷达与研究衍生应用。Supply Chain Intelligence: five AI perspectives, Weekly Radar and research spin-offs."></div>
  </main>
  <script>
    fetch('hero-bilingual.svg').then(r => {
      if (!r.ok) throw new Error('SVG could not be loaded');
      return r.text();
    }).then(svg => { document.getElementById('hero').innerHTML = svg; }).catch(() => {
      const img = document.createElement('img');
      img.src = 'hero-bilingual.svg'; img.alt = 'Supply Chain Intelligence · 全球供应链多模型洞察';
      img.style.width = '100%'; document.getElementById('hero').append(img);
      document.getElementById('motion').disabled = true;
    });
    document.getElementById('motion').addEventListener('click', function () {
      const paused = document.getElementById('hero').classList.toggle('paused');
      this.setAttribute('aria-pressed', String(paused)); this.textContent = paused ? '继续 / Play' : '暂停 / Pause';
    });
    document.getElementById('theme').addEventListener('click', function () {
      const dark = document.body.classList.toggle('dark');
      this.setAttribute('aria-pressed', String(dark)); this.textContent = dark ? '浅色背景 / Light' : '深色背景 / Dark';
    });
  </script>
</body>
</html>
