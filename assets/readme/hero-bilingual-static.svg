<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Supply Chain Intelligence · 全球供应链多模型洞察</title>
  <desc id="hero-desc">Supply Chain Portfolio: one research brief, five independent AI perspectives — Cursor x Grok 4.5, Kimi K3 Deep Research, WorkBuddy x Deepseek-V4-Pro, Gemini 3.6 Flash and Codex GPT-6 Astra. Weekly Radar and two research spin-offs: VeloCortex Maritime and TariffLens. 供应链研究作品集：同一命题、五种独立 AI 视角，每周情报雷达与两个研究衍生应用。静态备用版本。</desc>
