<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Supply Chain AI Research</title>
  <desc id="desc">Portfolio hero: same research brief compared across four independent AI models, with shipping-route motifs from the project palette.</desc>

  <defs>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a4fd6"/>
      <stop offset="100%" stop-color="#0e7a6d"/>
    </linearGradient>
    <clipPath id="frameClip">
      <rect width="1200" height="400" rx="28"/>
    </clipPath>
  </defs>

  <g id="frame" clip-path="url(#frameClip)">
    <rect width="1200" height="400" rx="28" fill="#f7f6f2"/>
    <rect width="1200" height="400" fill="#1a4fd6" fill-opacity="0.04"/>

    <g id="grid" stroke="#101418" stroke-opacity="0.045" stroke-width="1">
      <line x1="56" y1="0" x2="56" y2="400"/>
      <line x1="240" y1="0" x2="240" y2="400"/>
      <line x1="660" y1="0" x2="660" y2="400"/>
      <line x1="0" y1="56" x2="1200" y2="56"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="344" x2="1200" y2="344"/>
    </g>

    <g id="globe" transform="translate(530 200)" fill="none" stroke="#1a4fd6" stroke-width="1.25">
      <circle r="78" stroke-opacity="0.16"/>
      <ellipse rx="78" ry="38" stroke-opacity="0.16"/>
      <ellipse rx="78" ry="78" stroke-opacity="0.10" transform="rotate(32)"/>
      <ellipse rx="78" ry="78" stroke-opacity="0.10" transform="rotate(68)"/>
      <line x1="-78" y1="0" x2="78" y2="0" stroke-opacity="0.16"/>
      <line x1="0" y1="-78" x2="0" y2="78" stroke-opacity="0.16"/>
      <circle r="3.5" fill="#1a4fd6" fill-opacity="0.85" stroke="none"/>
    </g>

    <g id="routes-base" fill="none" stroke-linecap="round">
      <path d="M 72 90 Q 360 32 660 96" stroke="#1a4fd6" stroke-width="2" stroke-opacity="0.18" stroke-dasharray="8 8"/>
      <path d="M 72 318 Q 360 370 660 312" stroke="#0e7a6d" stroke-width="2" stroke-opacity="0.18" stroke-dasharray="8 8"/>
      <circle cx="72" cy="90" r="6" fill="#1a4fd6" fill-opacity="0.2" stroke="#1a4fd6" stroke-width="1.5"/>
      <circle cx="660" cy="96" r="6" fill="#1a4fd6" fill-opacity="0.2" stroke="#1a4fd6" stroke-width="1.5"/>
      <circle cx="72" cy="318" r="5" fill="#0e7a6d" fill-opacity="0.2" stroke="#0e7a6d" stroke-width="1.5"/>
      <circle cx="660" cy="312" r="5" fill="#0e7a6d" fill-opacity="0.2" stroke="#0e7a6d" stroke-width="1.5"/>
    </g>

    <g id="accent-route" fill="none" stroke-linecap="round">
      <path d="M 72 90 Q 360 32 660 96" stroke="url(#routeGrad)" stroke-width="2.5" stroke-dasharray="10 7"/>
      <path d="M 72 318 Q 360 370 660 312" stroke="#0e7a6d" stroke-width="2.25" stroke-dasharray="10 7"/>
      <circle cx="72" cy="90" r="7" fill="#1a4fd6" stroke="#ffffff" stroke-width="2"/>
      <circle cx="660" cy="96" r="7" fill="#1a4fd6" stroke="#ffffff" stroke-width="2"/>
      <circle cx="72" cy="318" r="6" fill="#0e7a6d" stroke="#ffffff" stroke-width="2"/>
      <circle cx="660" cy="312" r="6" fill="#0e7a6d" stroke="#ffffff" stroke-width="2"/>
    </g>

    <g id="title-block" transform="translate(64 82)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.18em" fill="#1a4fd6">AI-DRIVEN GLOBAL SUPPLY CHAIN RESEARCH</text>
      <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#101418" letter-spacing="-0.02em">Supply Chain Intelligence,</text>
      <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#101418" letter-spacing="-0.02em">Through Multiple AI Models</text>
      <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#3d454d">Same brief. Four independent AI reports. Live weekly radar.</text>

      <g transform="translate(0 184)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
        <rect width="118" height="32" rx="8" fill="#ffffff" stroke="#dcd9d0"/>
        <text x="59" y="21" text-anchor="middle" fill="#101418">4 reports</text>
        <rect x="128" width="138" height="32" rx="8" fill="#ffffff" stroke="#dcd9d0"/>
        <text x="197" y="21" text-anchor="middle" fill="#101418">25+ sources</text>
        <rect x="276" width="104" height="32" rx="8" fill="#ffffff" stroke="#dcd9d0"/>
        <text x="328" y="21" text-anchor="middle" fill="#101418">2026 H1</text>
        <rect x="390" width="128" height="32" rx="8" fill="#1a4fd6"/>
        <text x="454" y="21" text-anchor="middle" fill="#ffffff">open / MIT</text>
      </g>
    </g>

    <g id="proof-board" transform="translate(700 40)">
      <rect width="444" height="320" rx="18" fill="#ffffff" stroke="#dcd9d0" stroke-width="1.5"/>
      <rect width="444" height="52" rx="18" fill="#f1efe9"/>
      <rect y="34" width="444" height="18" fill="#f1efe9"/>
      <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="0.12em" fill="#1a4fd6">SAME BRIEF / 4 LENSES</text>

      <g transform="translate(18 68)">
        <rect width="408" height="54" rx="10" fill="#fafbfe" stroke="#e8e6df"/>
        <rect width="6" height="54" rx="3" fill="#1a4fd6"/>
        <text x="22" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#101418">Cursor x Grok</text>
        <text x="22" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#6e767f">Periodical Editor / journal editions</text>
      </g>
      <g transform="translate(18 130)">
        <rect width="408" height="54" rx="10" fill="#fafbfe" stroke="#e8e6df"/>
        <rect width="6" height="54" rx="3" fill="#0e7a6d"/>
        <text x="22" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#101418">Kimi Agent</text>
        <text x="22" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#6e767f">Investigative Journalist / live quotes</text>
      </g>
      <g transform="translate(18 192)">
        <rect width="408" height="54" rx="10" fill="#fafbfe" stroke="#e8e6df"/>
        <rect width="6" height="54" rx="3" fill="#1a4fd6"/>
        <text x="22" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#101418">WorkBuddy</text>
        <text x="22" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#6e767f">Industry Analyst / 3-axis controls</text>
      </g>
      <g transform="translate(18 254)">
        <rect width="408" height="54" rx="10" fill="#fafbfe" stroke="#e8e6df"/>
        <rect width="6" height="54" rx="3" fill="#0e7a6d"/>
        <text x="22" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#101418">Gemini</text>
        <text x="22" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#6e767f">Research Assistant / grounded Q&amp;A</text>
      </g>
    </g>
  </g>
</svg>
