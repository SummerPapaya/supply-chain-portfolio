<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img"
     aria-label="Animated banner for Inventory Control Desk: six panels for ROP/SS, PO and in-transit, on-hand alerts, WOS, ageing and E&amp;O, ABC×XYZ and supplier OTD">
  <title>Inventory Control Desk</title>
  <desc>An inventory control workbench replaying UCI Online Retail weekly demand, with animated panels for reorder points, POs, alerts, turnover, ageing, service levels and OTD</desc>

  <!-- 纸墨底 -->
  <rect x="0" y="0" width="1200" height="320" rx="14" fill="#f7f6f2" stroke="#d8d4c8" stroke-width="1"/>

  <!-- 眉标 -->
  <circle cx="52" cy="40" r="3.5" fill="#0e7a6d">
    <animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="44" font-size="11" letter-spacing="1.6" font-weight="700"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#3f6079">INVENTORY CONTROL DESK</text>
  <text x="1152" y="44" text-anchor="end" font-size="10.5" letter-spacing=".8"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#8a8577">DATA: UCI ONLINE RETAIL · CC BY 4.0</text>
  <path d="M48 58 H1152" stroke="#d8d4c8" stroke-width="1"/>

  <!-- 左：标题区 -->
  <text x="48" y="128" font-size="38" font-weight="700" fill="#1a1f26"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Inventory Control Desk</text>
  <text x="48" y="166" font-size="16" fill="#4a5058"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">12 views · one metrics engine · one verifiable data contract</text>
  <text x="48" y="194" font-size="11" fill="#8a8577"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">120 SKUs · 203 POs · 167 receipts · 52 weeks · 12 views</text>

  <!-- 三个能力标签 -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#3f6079">
    <rect x="48" y="214" width="150" height="28" rx="4" fill="#fffdf9" stroke="#d8d4c8"/>
    <text x="62" y="232">NO KEYS · NO SERVER</text>
    <rect x="208" y="214" width="150" height="28" rx="4" fill="#fffdf9" stroke="#d8d4c8"/>
    <text x="222" y="232">FILE:// READY</text>
    <rect x="368" y="214" width="170" height="28" rx="4" fill="#fffdf9" stroke="#d8d4c8"/>
    <text x="382" y="232">GBP · DECLARED IN DATA</text>
  </g>

  <!-- 红线声明 -->
  <path d="M48 268 V296" stroke="#3f6079" stroke-width="3"/>
  <text x="62" y="280" font-size="10" font-weight="700" letter-spacing=".6"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#3f6079">REVIEW ONLY · NOT A PURCHASE ORDER</text>
  <text x="62" y="295" font-size="11.5" fill="#4a5058" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Suggested quantities are derived for review before any ERP write-back</text>

  <!-- 右：六格多功能微型仪表盘 -->
<g>
  <rect x="566" y="76" width="586" height="176" rx="8" fill="#fffdf9" stroke="#d8d4c8"/>
  <text x="578" y="70" font-size="8.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#8a8577">12 VIEWS · 1 ENGINE · SINGLE SOURCE OF TRUTH</text>
<g>
    <rect x="574" y="84" width="279" height="49" rx="4" fill="#fbfaf6" stroke="#e8e5dd"/>
