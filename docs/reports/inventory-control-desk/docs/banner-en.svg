    <rect x="875" y="167" width="200" height="4" rx="2" fill="#e8e5dd"/>
    <path d="M875 164 V172" stroke="#d8d4c8" stroke-width="1"/><path d="M925 164 V172" stroke="#d8d4c8" stroke-width="1"/><path d="M975 164 V172" stroke="#d8d4c8" stroke-width="1"/><path d="M1025 164 V172" stroke="#d8d4c8" stroke-width="1"/><path d="M1075 164 V172" stroke="#d8d4c8" stroke-width="1"/>
