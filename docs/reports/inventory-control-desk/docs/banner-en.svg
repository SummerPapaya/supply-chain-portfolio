    <rect x="875" y="106" width="200" height="4" rx="2" fill="#e8e5dd"/><rect x="875" y="106" width="200" height="4" rx="2" fill="#3f6079"><animate attributeName="width" values="0;200;200" keyTimes="0;.35;1" dur="5s" begin="0s" repeatCount="indefinite"/></rect><rect x="875" y="113" width="200" height="4" rx="2" fill="#e8e5dd"/><rect x="875" y="113" width="200" height="4" rx="2" fill="#3f6079"><animate attributeName="width" values="0;200;200" keyTimes="0;.35;1" dur="5s" begin="0.5s" repeatCount="indefinite"/></rect><rect x="875" y="120" width="200" height="4" rx="2" fill="#e8e5dd"/><rect x="875" y="120" width="200" height="4" rx="2" fill="#0e7a6d"><animate attributeName="width" values="0;200;200" keyTimes="0;.35;1" dur="5s" begin="1s" repeatCount="indefinite"/></rect>
