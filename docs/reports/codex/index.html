function researchPlot(x){if(!x)return '';const entries=['Q1','Q2','H1'].filter(p=>Number.isFinite(x.values[p]));if(!entries.length)return '';const max=Math.max(...entries.map(p=>x.values[p]))*1.12;return `<div class="sector-plot" role="img" aria-label="${esc(plain(x.name)+' / '+plain(x.unit)+' / '+entries.map(p=>p+': '+x.values[p]).join(', '))}"><h4>${t(x.name)}</h4>${['Q1','Q2','H1'].map(p=>`<div class="sector-plot-row ${p===period?'selected':''}"><span>${p}</span>${Number.isFinite(x.values[p])?`<div class="sector-track"><i style="width:${x.values[p]/max*100}%"></i></div><b>${x.values[p].toLocaleString('en-US',{maximumFractionDigits:3})}</b>`:`<div class="gap-track">${t(pair('未核验','Unverified'))}</div><b>—</b>`}</div>`).join('')}<div class="axis-name">${t(x.unit)} · ${t(pair('2026各窗口参照 · 当前窗口高亮 · 从0起；非连续插值','2026 reference windows · Selection highlighted · Zero baseline; no interpolation'))}</div><div class="caption">${t(x.note)} ${ref([...new Set(Object.values(x.ids).flat())])}</div></div>`;}

const VIZ={INK:'#17202A',PAPER:'#F7F5F0',MUT:'#66717A',GRID:'#D9DEE2',FAINT:'#C5CBD0',BLUE:'#356AA0',TEAL:'#23806D',ORANGE:'#C56A3D',RED:'#B64B4B'};

barChart=function(title,items,caption,unit=pair('同比变化（%）','YoY change (%)')){
 if(title[0].startsWith('社会物流总额：'))return vizPairChart(pair('社会物流总额同比','Social logistics growth'),{Q1:6.2,Q2:4.4,H1:5.1},pair('%','%'),pair('各期可比价格同比由来源公布。Q2较Q1的变化单位为百分点；H1同比使用半年同口径基数。','Published comparable-price YoY. Changes between Q1 and Q2 are percentage points; H1 uses its own half-year comparison base.'),{Q1:['C1'],Q2:['C1'],H1:['C1']},{type:'growth'});
 const lo=Math.min(0,...items.map(a=>a[1])),hi=Math.max(0,...items.map(a=>a[1])),axisStep=vizStep(Math.max(1,hi-lo)/4),min=lo<0?Math.floor(lo/axisStep)*axisStep:0,max=Math.max(axisStep,Math.ceil(hi/axisStep)*axisStep),zero=(0-min)/(max-min)*100;

 return vizFrame(title,`${t(unit)} · ${t(pair('统一零基线；颜色仅区分类别，长度表示数值','Common zero baseline; colour distinguishes categories and length encodes value'))}`,body,caption,'BAR');

function windowKpis(fallback){
 if(market==='cn'&&period!=='H1')return metric(pair('社会物流总额同比','Social logistics YoY'),period==='Q1'?6.2:4.4,'%',pair('本季同比 · 可比价格','Selected-quarter YoY · Comparable prices'),['C1'])+metric(pair('物流业总收入','Logistics revenue'),'—',pair('本季未纳入','Quarter unavailable'),pair('未核验本季度同口径数据','No verified matching quarter in the ledger'),[])+metric(pair('物流总费用 / GDP','Logistics costs / GDP'),'—','%',pair('未核验本季度同口径数据','No verified matching quarter in the ledger'),[]);
 if(market==='world'&&period==='Q2')return metric(pair('航空货运需求累计同比','Cumulative air cargo demand YoY'),'—','%',pair('Q2累计数据未核验；月度见下图','Q2 cumulative unverified; monthly observations below'),[])+metric(pair('航空货运运力累计同比','Cumulative air cargo capacity YoY'),'—','%',pair('Q2累计数据未核验','Q2 cumulative unverified'),[])+metric(pair('马士基集团营业收入','Maersk group revenue'),15.8,pair('十亿美元','USD bn'),pair('Q2 2026 · 企业案例','Q2 2026 · Company case'),['M1']);
 if(market==='world'&&period==='H1')return metric(pair('全球航空货运需求同比','Global air cargo demand YoY'),4.9,'%',pair('H1累计CTK · 来源YTD','H1 cumulative CTK · Published YTD'),['A6'])+metric(pair('全球航空货运运力同比','Global air cargo capacity YoY'),2.1,'%',pair('H1累计ACTK · 来源YTD','H1 cumulative ACTK · Published YTD'),['A6'])+metric(pair('世界货物贸易量同比','World goods trade volume YoY'),'—','%',pair('H1实际增速未核验；Q1数据见跨期参考','H1 actual unverified; Q1 appears in cross-period references'),[]);
 return fallback;
}
function macroReferences(){if(market==='world'&&period==='H1')return `<details class="context-only"><summary>${t(pair('跨期参考：Q1世界货物贸易量','Cross-period reference: Q1 world merchandise trade'))}</summary><p>${t(pair('2026 Q1同比 +3.2%（机构估算）。此数值仅覆盖1—3月。','2026 Q1 grew 3.2% YoY (institutional estimate). This observation covers January–March only.'))} ${ref(['W1'])}</p></details>`;return '';}
function metricType(x){if(x.m==='cn'&&x.s==='ai')return x.k==='growth'?'stockGrowth':'stock';if(x.s==='robot'&&x.k==='cash')return 'stock';return x.k==='growth'?'growth':x.k==='profit'?'ratio':'flow';}
function basisLabel(type,p){const endpoint=p==='Q1'?pair('3月31日','March 31'):pair('6月30日','June 30');if(type==='stock'||type==='stockGrowth')return pair(endpoint[0]+(type==='stockGrowth'?'存量同比':'期末存量'),endpoint[1]+(type==='stockGrowth'?' stock YoY':' ending stock'));if(type==='growth')return p==='H1'?pair('半年累计同比','Half-year cumulative YoY'):pair('本季度同比','Quarterly YoY');if(type==='ratio')return p==='H1'?pair('半年期间比率','Half-year ratio'):pair('季度期间比率','Quarterly ratio');return p==='H1'?pair('1—6月累计发生额','January–June total'):p==='Q1'?pair('1—3月发生额','January–March flow'):pair('4—6月发生额','April–June flow');}
function vizPairChart(title,values,unit,note,ids,options={}){const type=options.type||'flow',a=values.Q1,b=values.Q2,v=values[period],isRate=['ratio','growth','stockGrowth'].includes(type),stock=['stock','stockGrowth'].includes(type);
 const sub=t(basisLabel(type,period));let body=`<div class="reading-main" data-type="${type}" data-period="${period}"><div class="period-label">2026 ${period} · ${t(basisLabel(type,period))}</div><div class="value ${Number.isFinite(v)?'':'unavailable'}">${Number.isFinite(v)?vizNum(v):'—'}</div><div class="unit">${t(unit)}</div><div class="meta">${Number.isFinite(v)?t(options.derived?.includes(period)?pair('本报告计算','Report calculation'):options.kind==='case'?pair('企业案例 · 来源披露','Company case · Published'):pair('来源公布','Source published'))+' '+ref(ids[period]||[]):t(pair('本窗口缺少已核验的可比数据','Verified comparable data unavailable for this window'))}</div></div>`;
 if(period!=='Q1'){
  const list=['Q1','Q2'],ceiling=type==='ratio'?100:Math.max(1,...list.map(p=>Math.abs(values[p]||0)))*1.1;
  body+=`<div class="quarter-comparison"><div class="meta">${t(stock?pair('期末对照：3月底 → 6月底','Endpoint comparison: March end → June end'):pair('季度对照：Q1 → Q2','Quarter comparison: Q1 → Q2'))}</div>${list.map(p=>`<div class="quarter-row ${p==='Q2'?'active':''} ${Number.isFinite(values[p])?'':'empty'}"><span>${p}</span><div class="quarter-track">${Number.isFinite(values[p])?`<i style="width:${Math.abs(values[p])/ceiling*100}%"></i>`:''}</div><b>${Number.isFinite(values[p])?vizNum(values[p]):'—'}</b></div>`).join('')}<p class="comparison-note">${t(type==='ratio'?pair('0—100%固定刻度；半年比率采用来源值。','Fixed 0–100% scale; half-year ratio uses the published value.'):stock?pair('H1与Q2共享6月底期末；存量不累加。','H1 and Q2 share June end; stocks are not added.'):isRate?pair('各期同比独立公布；半年同比不由季度同比平均。','Each period has its own published YoY; half-year growth is not a quarterly average.'):pair('条形从0起；比较未做季节调整，金额未剔除价格影响。','Bars start at zero; comparisons are not seasonally adjusted and monetary values are nominal.'))}</p></div>`;
  if(Number.isFinite(a)&&Number.isFinite(b)){const d=Number((b-a).toFixed(6));body+=`<p class="period-change" data-delta-unit="${isRate?'pp':'absolute'}">${t(stock?pair('期末变化','Endpoint change'):isRate?pair('Q2较Q1变化','Q2 minus Q1'):pair('Q2较Q1绝对变化','Absolute Q2 minus Q1'))}<strong>${d>0?'+':''}${vizNum(d)}</strong>${t(isRate?pair('个百分点','percentage points'):unit)}</p>`;}
 }
 const others=['Q1','Q2','H1'].filter(p=>p!==period&&(period==='Q1'||p==='H1'));if(others.length)body+=`<details class="context-only"><summary>${t(pair('跨期参考 · 不属于所选窗口','Cross-period references · Outside selection'))}</summary><div class="reference-grid">${others.map(p=>`<div>2026 ${p}<b>${Number.isFinite(values[p])?vizNum(values[p]):'—'}</b>${t(unit)}<div class="meta">${t(basisLabel(type,p))} ${Number.isFinite(values[p])?ref(ids[p]||[]):''}</div></div>`).join('')}</div></details>`;
 return vizFrame(title,sub,body,t(note)+' '+ref([...new Set((period==='Q1'?ids.Q1:period==='Q2'?[...(ids.Q1||[]),...(ids.Q2||[])]:Object.values(ids).flat())||[])]),'PERIOD');
}
researchPlot=function(x){return x?vizPairChart(x.name,x.values,x.unit,x.note,x.ids,{type:metricType(x),derived:x.derived,kind:x.kind}):'';};
function vizOriginalPlot(s){return vizPairChart(s.metric,s.values,s.unit,s.formula,s.ids,{type:s.id==='cold'?'ratio':'flow',derived:s.derived,kind:market==='world'&&s.id==='cold'?'case':'reported'});}
const sectorTone=id=>`tone-${id}`;
function classicSectorPanel(s,i){return `<article class="sector-panel ${sectorTone(s.id)}"><div class="eyebrow">0${i+1} / ${t(s.name)}</div>${vizOriginalPlot(s)}<details class="context-only"><summary>${t(pair('补充背景 · 请按文中时间阅读','Supporting context · Periods stated below'))}</summary><p class="sector-fact">${t(s.fact)} ${ref(market==='cn'&&s.id==='cold'?['F2']:market==='cn'&&s.id==='chips'?['N2']:market==='world'&&s.id==='ev'?['B2']:s.ids[period])}</p></details><div class="chain">${s.chain.map(c=>`<span>${t(c)}</span>`).join('<b aria-hidden="true">→</b>')}</div><p class="sector-analysis">${t(s.analysis)}</p></article>`;}
expandedSectors=function(){return `<div class="sector-group"><span>02</span><h3>${t(pair('战略基础设施与自动化','Strategic infrastructure & automation'))}</h3></div><div class="sector-grid">${Object.entries(researchNames).map(([s,name],i)=>{const scale=availableMetric(s,'scale'),growth=availableMetric(s,'growth'),w=researchWatch[s];return `<article class="sector-panel expanded-sector ${sectorTone(s)}"><div class="eyebrow">0${i+5} / ${t(name)}</div>${researchPlot(scale||growth)}<div class="secondary-metric"><h4>${t(scale?pair('景气观察 · 本窗口同比','Momentum · Selected-window YoY'):pair('规模总量 · 本窗口','Scale · Selected window'))}</h4>${scale?`<p class="meta">${growth?t(growth.name):t(pair('可比同比未核验','Comparable YoY unverified'))}</p>${researchDatum(growth)}`:researchDatum(scale)}</div><div class="chain">${w.chain.map(p=>`<span>${t(p)}</span>`).join('<b aria-hidden="true">→</b>')}</div><p class="sector-analysis">${t(w.view)}</p><p class="meta">${t(pair('效率与风险：见下方三层诊断；未核验项目不补值。','Efficiency and risk: use the diagnostic below; unverified observations stay blank.'))}</p></article>`}).join('')}</div>`;};
sectorBlock=function(){return `<div class="sector-toolbar"><p>${t(pair('八个产业按两组阅读。季度读数带只比较同口径Q1与Q2，H1按总量、存量、期间比率分别列示；颜色标识产业主题，不表示排名。','Read the eight industries in two groups. Period strips compare like-for-like Q1 and Q2, with H1 totals, stocks and period ratios explicitly distinguished. Colour identifies themes, not rank.'))}</p></div><div class="sector-group"><span>01</span><h3>${t(pair('核心商品流与履约','Core goods flows & fulfillment'))}</h3></div><div class="sector-grid">${sectorSeries[market].map(classicSectorPanel).join('')}</div><p class="meta">${t(pair('医药供应链补充观察：温控要求须按具体产品核验，食品冷链的吨数、收入或车辆数据不能外推医药冷链规模。本版未纳入未经验证的医药物流市场规模。','Pharmaceutical supply-chain note: temperature requirements must be verified for the specific product. Food tonnage, revenue and vehicle data cannot establish pharmaceutical cold-chain market size. No unverified pharma-logistics market-size estimate is included.'))}</p>${expandedSectors()}${dimensionBlock()}`;};
render();
</script></body></html>
