  <text x="64" y="194" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="58" font-weight="760">供应链行业报告</text>
  <text x="64" y="245" fill="#c8d8e9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="34" font-weight="650">Supply Chain Review</text>
  <text x="64" y="294" fill="#a9c7ed" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22">中国国内与国际市场 · 中英双语 · 可追溯研究</text>
  <text x="64" y="333" fill="#dbe7f5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">38 SOURCES  /  98 RECORDS  /  VERIFIED 2026-09-06</text>
  <g transform="translate(690 68)">
