    <text x="350" y="172" fill="#c8d8e9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20">1—6月</text>
    <rect x="0" y="214" width="470" height="78" rx="10" fill="#203e61"/>
