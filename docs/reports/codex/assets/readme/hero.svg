    <circle cx="410" cy="94" r="12" fill="#f2ad5f"/>
    <text x="44" y="142" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="30" font-weight="700">Q1</text>
    <text x="25" y="172" fill="#c8d8e9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20">1—3月</text>
    <text x="214" y="142" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="30" font-weight="700">Q2</text>
