<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">2026 H1 Supply Chain Review</title>
  <desc id="desc">A bilingual supply-chain research report with China and international views, Q1 Q2 H1 windows, 38 sources and 98 records.</desc>
  <rect width="1200" height="400" rx="24" fill="#132a49"/>
  <path d="M64 80H488" stroke="#35aaa7" stroke-width="4"/>
