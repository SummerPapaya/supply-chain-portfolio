  .stats { margin: 0; }
  .btn,.pill,select { border:1px solid var(--line); background:#fff; color:var(--text); border-radius:999px; padding:8px 14px; font-size:14px; cursor:pointer; }
  select { border-radius:10px; }
  .btn.active,.pill.active { background:var(--blue); border-color:var(--blue); color:#fff; }

  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; min-width:0; }

  th,td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; overflow-wrap:anywhere; }
  th { background:transparent; color:var(--text); font-weight:700; font-size:12px; letter-spacing:0.08em; border-bottom:2px solid var(--text); padding:8px 14px 10px; }

const t = (lang, text) => (lang === 'zh' ? text.zh : text.en);
const rowsOf = (lang, rows) => rows.map((r) => [t(lang, r.a), t(lang, r.b), t(lang, r.c)]);

function card(value, zh, en, tone) {
  return { value, label: { zh, en }, tone };
}

function move(themeZh, themeEn, signalZh, signalEn, actionZh, actionEn) {
  return {
    a: { zh: themeZh, en: themeEn },
    b: { zh: signalZh, en: signalEn },
    c: { zh: actionZh, en: actionEn },
  };
}

function el(tag, attrs={}, children=[]) {
  const node = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "className") node.className = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

function table(headers, rows) {
  const t = el("table");
  const thead = el("thead"); const hr = el("tr");
  headers.forEach(h => hr.appendChild(el("th", {}, h)));
  thead.appendChild(hr); t.appendChild(thead);
  const tb = el("tbody");
  rows.forEach(r => { const tr = el("tr"); r.forEach(c => tr.appendChild(el("td", {}, c))); tb.appendChild(tr); });
  t.appendChild(tb); return t;
}

function renderLineChart(container, categories, data, seriesName, axis) {
  const w=900, h=280, pad={l:56,r:64,t:28,b:40};
  const max = axis && axis.yMax != null ? axis.yMax : (Math.max(...data) * 1.15 || 1);
  const min = axis && axis.yMin != null ? axis.yMin : Math.min(0, Math.min(...data));
  const span = max - min || 1;
  const x = (i) => pad.l + (i * (w - pad.l - pad.r)) / Math.max(1, categories.length - 1);
  const y = (v) => pad.t + (1 - (v - min) / span) * (h - pad.t - pad.b);
  const pts = data.map((v,i) => `${x(i)},${y(v)}`).join(" ");
  let grid = "";
  for (let g=0; g<=4; g++) {
    const val = min + (span * g) / 4; const yy = y(val);
    grid += `<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#e2e8f0"/>`;
    grid += `<text x="${pad.l-8}" y="${yy+4}" text-anchor="end" fill="#64748b" font-size="11">${val.toFixed(1)}</text>`;
  }
  const labels = categories.map((c,i) => `<text x="${x(i)}" y="${h-12}" text-anchor="middle" fill="#64748b" font-size="11">${c}</text>`).join("");
  const stroke = (axis && axis.color) || "#2563eb";
  const fmt = (v) => (axis && axis.ref === 0 ? Number(v).toFixed(2) : String(v));
  const dots = data.map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${stroke}"/>`).join("");
  const valueLabels = data.map((v,i) => `<text x="${x(i)}" y="${y(v)-8}" text-anchor="middle" fill="#0f172a" font-size="11">${fmt(v)}</text>`).join("");
  let ref = "";
  if (axis && axis.ref != null) {
    const yy = y(axis.ref);
    ref = `<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="${w-pad.r}" y="${yy-4}" text-anchor="end" fill="#64748b" font-size="11">${axis.refLabel || axis.ref}</text>`;
  }
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMin meet" role="img" aria-label="${seriesName}">${grid}${ref}<polyline fill="none" stroke="${stroke}" stroke-width="2.5" points="${pts}"/>${dots}${valueLabels}${labels}<text x="${pad.l}" y="16" fill="#0f172a" font-size="12" font-weight="600">${seriesName}</text></svg>`;
}

function renderRadar(container, cnVals, glVals, lang) {
  const cx=260, cy=190, maxR=120, rings=[20,40,60,80,100];
  const toPoint = (idx, value) => {
    const angle = -Math.PI/2 + (idx * 2 * Math.PI) / RADAR_AXES.length;
    const r = (value/100)*maxR;
    return {x: cx + Math.cos(angle)*r, y: cy + Math.sin(angle)*r};
  };
  const poly = (values) => values.map((v,i)=>`${toPoint(i,v).x},${toPoint(i,v).y}`).join(" ");
  let svg = `<svg viewBox="0 0 520 380" width="100%" style="max-width:760px">`;
  rings.forEach(ring => {
    const pts = RADAR_AXES.map((_,i)=>{const p=toPoint(i,ring); return `${p.x},${p.y}`;}).join(" ");
    svg += `<polygon points="${pts}" fill="none" stroke="#cbd5e1" stroke-width="1"/>`;
  });
  RADAR_AXES.forEach((axis,i) => {
    const pEnd = toPoint(i,100), pLabel = toPoint(i,114);
    svg += `<line x1="${cx}" y1="${cy}" x2="${pEnd.x}" y2="${pEnd.y}" stroke="#cbd5e1"/>`;
    svg += `<text x="${pLabel.x}" y="${pLabel.y}" fill="#64748b" font-size="11" text-anchor="middle">${t(lang, axis)}</text>`;
  });
  svg += `<polygon points="${poly(cnVals)}" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="2.4"/>`;
  svg += `<polygon points="${poly(glVals)}" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-dasharray="5 4"/>`;
  svg += `</svg>`;
  container.innerHTML = svg;
}

      : "2026 H2 so far only contains July–September. Do not write it up as the full second half until later official readings exist.";
  } else if (isArchive) {
    arch.style.display = "block";
    arch.textContent = lang === "zh"
      ? "纵轴是档案分，基准=100，不是 LPI 百分数。全球 2025 年已经改用官方 GSCPI，两边单位不同，不能叠在一张图上比较。"
      : "The vertical axis is an archive score, baseline=100, not an LPI percent. Global 2025 now uses official GSCPI. The units differ, so the two series cannot share a chart.";
  } else arch.style.display = "none";

  document.getElementById("h2").textContent = lang==="zh"
    ? t(lang, PERIOD_META[period].label) + "，三件要做的事"
    : "Three moves for " + t(lang, PERIOD_META[period].label);
  document.getElementById("h3").style.display = "none";
  document.getElementById("h6").textContent = lang==="zh"?"中外能力结构对照":"China–Global capability structure";
  document.getElementById("h7").textContent = lang==="zh"?"来源与口径":"Sources and vintage";

  const metrics = document.getElementById("metrics"); metrics.innerHTML = "";
  brief.cards.forEach(c=>{
    metrics.appendChild(el("div", {className:"stat "+(c.tone||"neutral")}, [el("div",{className:"v"},c.value), el("div",{className:"l"},t(lang,c.label))]));
  });

  const dyn = document.getElementById("dynamics"); dyn.innerHTML = "";
  dyn.appendChild(el("p", {className:"muted"}, lang==="zh"
    ? "读完上面这条月度路径之后的动作。换时间，判断、图和这张表一起换。"
    : "Actions after reading the monthly path above. The judgment, the chart, and this table change together."));
  dyn.appendChild(table(lang==="zh"?["问题","这段时间的事实","动作"]:["Question","What happened in this period","Action"], rowsOf(lang, brief.moves)));

  document.getElementById("chartTitle").textContent = (scope==="cn"
    ? (lang==="zh"?"中国物流业景气指数（LPI）":"China Logistics Prosperity Index (LPI)")
    : (lang==="zh"?"全球供应链压力指数（GSCPI）":"Global Supply Chain Pressure Index (GSCPI)")) + " · " + t(lang, PERIOD_META[period].range);
  document.getElementById("chartCaption").textContent = isArchive
    ? (lang==="zh"?"横轴：月份。纵轴：档案分（基准=100）。来源：本版占位，不是中物联月度值。":"Horizontal axis: month. Vertical axis: archive score (baseline=100). Source: placeholder in this edition, not a CFLP monthly print.")
    : scope==="cn"
      ? (lang==="zh"?"横轴：月份。纵轴：LPI（%）。50 为荣枯线。1–5 月沿用上半年已引用读数；6 月由 7 月环比回推；7–9 月为 2026 年 8–10 月公开月报。":"Horizontal axis: month. Vertical axis: LPI (%). 50 is the expansion line. January–May keep the H1 citations; June is implied by the July change; July–September are the August–October 2026 releases.")
      : (lang==="zh"?"横轴：月份。纵轴：标准差，0 为长期均值。来源：纽约联储 GSCPI，2026 年 10 月发布口径。历史值每次发布都会修订。":"Horizontal axis: month. Vertical axis: standard deviations, 0 = long-run average. Source: NY Fed GSCPI, October 2026 vintage. History is revised at every release.");
  const axis = isArchive ? {yMin:96, yMax:106, color:"#2563eb"} : scope==="cn" ? {yMin:46, yMax:54, ref:50, refLabel: lang==="zh"?"荣枯线 50":"50", color:"#2563eb"} : {yMin:-0.4, yMax:2.1, ref:0, refLabel: lang==="zh"?"长期均值 0":"Average 0", color:"#ea580c"};
  renderLineChart(document.getElementById("lineChart"), chart.categories, chart.data, scope==="cn"?(isArchive?(lang==="zh"?"档案分":"Archive score"):"LPI"):"GSCPI", axis);

  document.getElementById("segIntro").textContent = lang==="zh"
    ? "五个品类的相对成熟度。这不是上面那段时间的新数字，换时间分数不变。雷达 0–100，越高表示越成熟。"
    : "Relative maturity across five segments. These are not new figures for the period above, and the scores stay put when the period changes. Radar 0–100; higher means more mature.";
  const pills = document.getElementById("segPills"); pills.innerHTML = "";
  Object.keys(SPECIALTY_CONFIG).forEach(key=>{
    pills.appendChild(el("button", {className:"pill"+(state.specialtyTab===key?" active":""), type:"button", onClick:()=>{state.specialtyTab=key; render();}}, t(lang, SPECIALTY_CONFIG[key].title)));
  });
  document.getElementById("radarTitle").textContent = t(lang, specialty.title);
  document.getElementById("segNote").textContent = t(lang, specialty.note);
  const segFacts = document.getElementById("segFacts"); segFacts.innerHTML = "";
  specialty.stats.forEach(c=>{
    segFacts.appendChild(el("span", {}, c.value + " · " + t(lang, c.label)));
  });
  const segTable = document.getElementById("segTable"); segTable.innerHTML = "";
  segTable.appendChild(table(lang==="zh"?["模块","结构观察","长期做法"]:["Module","Structural pattern","Standing practice"], rowsOf(lang, specialty.rows)));
  renderRadar(document.getElementById("radar"), specialty.radar.cn, specialty.radar.global, lang);
  document.getElementById("legendCn").textContent = lang==="zh"?"中国 · 实线":"China · solid";
  document.getElementById("legendGl").textContent = lang==="zh"?"全球 · 虚线":"Global · dashed";

  document.getElementById("sources").innerHTML = `<ol>
    <li><a href="https://www.newyorkfed.org/research/policy/gscpi" target="_blank" rel="noopener">New York Fed GSCPI</a> — ${lang==="zh"?"9月 1.28 于 2026-10-06 公布，8月初值 1.06 修订为 1.20。":"September 1.28 released 2026-10-06; August revised from 1.06 to 1.20."}</li>
    <li><a href="https://www.gov.cn/yaowen/liebiao/202610/content_7082976.htm" target="_blank" rel="noopener">2026-10-11 gov.cn</a> — ${lang==="zh"?"9月 LPI 51.5%。":"September LPI 51.5%."}</li>
    <li><a href="http://sh.people.com.cn/n2/2026/1013/c134768-41720304.html" target="_blank" rel="noopener">${lang==="zh"?"人民日报 2026-10-13":"People's Daily, 2026-10-13"}</a></li>
    <li><a href="https://finance.jrj.com.cn/2026/10/13094058690629.shtml" target="_blank" rel="noopener">${lang==="zh"?"中物联 9 月解读":"CFLP September commentary"}</a></li>
    <li><a href="https://www.gov.cn/yaowen/liebiao/202608/content_7077587.htm" target="_blank" rel="noopener">${lang==="zh"?"7月 LPI 50.4%":"July LPI 50.4%"}</a> · <a href="https://www.chinanews.com.cn/cj/2026/09-05/10690932.shtml" target="_blank" rel="noopener">${lang==="zh"?"8月 LPI 50.9%":"August LPI 50.9%"}</a></li>
  </ol>
  <p class="muted">${lang==="zh"?"1–5月中国 LPI 沿用本报告上半年已引用的中物联读数。6月 50.6% 由 7月“较上月回落 0.2 个百分点”回推。2025年中国月度官方序列本版未核到。5月末 SCFI 与 WCI 没有刷新到 9 月，因此不再放进三季度卡片。":"January–May China LPI keeps the CFLP prints already cited in the H1 edition. June's 50.6% is implied by July's 0.2-point decline. A citable official China monthly series for 2025 was not found. Late-May SCFI and WCI were not refreshed through September, so they are no longer in the Q3 cards."}</p>`;
  document.getElementById("footer").textContent = lang==="zh"
    ? "HTML 预览版 · 数据与结构来自 report.canvas.tsx · 本地打开即可审阅，无需构建。"
    : "HTML preview · content and structure from report.canvas.tsx · open locally, no build step.";
}

render();

</script>
