<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026供应链行业报告</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="2026年供应链行业报告（1–9月）：中国与国际双视角，季度、半年与前三季度窗口，中英双语，所有数据附可核查来源。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* 版式概念：一份"航运舱单"式的行业报告——顶部固定控制栏，标题区直接给出论点，
   之后是编号章节；数字用等宽体标注口径，图表统一在一张冷灰"海图纸"上。 */
:root {
  --paper: #edf1f4;
  --sheet: #fafbfc;
  --sheet-2: #f2f5f8;
  --ink: #0f1c29;
  --ink-2: #3c4956;
  --muted: #677583;
  --rule: #d3dae1;
  --rule-soft: #e3e8ed;
  --brand: #12324d;
  --brand-ink: #ffffff;
  --accent: #b8431a;
  --wash: rgba(18, 50, 77, 0.07);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s-prev: #9aa6b2;
  --neg: #e34948;
  --grid: #e0e5ea;
  --axis: #bfc8d1;
  --good: #1d7a3a;
  --bad: #b42318;
  --warn: #9a5b00;
  --good-bg: rgba(12, 163, 12, 0.10);
  --bad-bg: rgba(208, 59, 59, 0.10);
  --warn-bg: rgba(250, 178, 25, 0.16);
  --shadow: 0 1px 2px rgba(15, 28, 41, 0.06), 0 6px 24px -12px rgba(15, 28, 41, 0.18);

  /* 中文一律用系统字体（苹方 / 宋体-简 / 微软雅黑 / Noto CJK），不下载中文网页字体；英文网页字体在页面渲染后异步加载 */
  --f-display: "Source Serif 4", Georgia, "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Microsoft YaHei", serif;
  --f-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;

  --t-xs: 0.75rem;
  --t-sm: 0.8125rem;
  --t-base: 0.9375rem;
  --t-md: 1.0625rem;
  --t-lg: 1.375rem;
  --t-xl: 1.875rem;
  --t-2xl: clamp(1.9rem, 1.2rem + 2.6vw, 3.1rem);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b131b;
    --sheet: #111b25;
    --sheet-2: #15212c;
    --ink: #e6ecf1;
    --ink-2: #b1bdc8;
    --muted: #8593a1;
    --rule: #263542;
    --rule-soft: #1c2934;
    --brand: #a8cbee;
    --brand-ink: #0b131b;
    --accent: #f08a5d;
    --wash: rgba(168, 203, 238, 0.09);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s-prev: #66737f;
    --neg: #e66767;
    --grid: #1f2c38;
    --axis: #34444f;
    --good: #4cc46a;
    --bad: #ff7d6e;
    --warn: #f2b84b;
    --good-bg: rgba(76, 196, 106, 0.12);
    --bad-bg: rgba(255, 125, 110, 0.12);
    --warn-bg: rgba(242, 184, 75, 0.13);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -14px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b131b;
  --sheet: #111b25;
  --sheet-2: #15212c;
  --ink: #e6ecf1;
  --ink-2: #b1bdc8;
  --muted: #8593a1;
  --rule: #263542;
  --rule-soft: #1c2934;
  --brand: #a8cbee;
  --brand-ink: #0b131b;
  --accent: #f08a5d;
  --wash: rgba(168, 203, 238, 0.09);
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s-prev: #66737f;
  --neg: #e66767;
  --grid: #1f2c38;
  --axis: #34444f;
  --good: #4cc46a;
  --bad: #ff7d6e;
  --warn: #f2b84b;
  --good-bg: rgba(76, 196, 106, 0.12);
  --bad-bg: rgba(255, 125, 110, 0.12);
  --warn-bg: rgba(242, 184, 75, 0.13);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -14px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
html { scroll-padding-top: 132px; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-base);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }

/* ---------- 控制栏 ---------- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.bar-in { display: flex; align-items: center; gap: 12px 20px; padding-block: 10px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.mark-box {
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
  border: 1.5px solid var(--ink); padding: 3px 6px 2px; line-height: 1.1; border-radius: 3px; white-space: nowrap;
}
.mark-name { font-size: var(--t-sm); color: var(--ink-2); white-space: nowrap; }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav a {
  font-size: var(--t-sm); text-decoration: none; color: var(--muted); padding: 6px 9px; border-radius: 6px; white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--wash); }
.nav a.on { color: var(--ink); background: var(--wash); font-weight: 500; }
.ctrls { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; }
.ctrl { display: flex; align-items: center; gap: 6px; }
.ctrl-l { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.seg { display: inline-flex; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button {
  font: inherit; font-size: var(--t-sm); border: 0; background: transparent; color: var(--ink-2);
  padding: 5px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; line-height: 1.3;
}
.seg button:hover { background: var(--wash); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 500; }
@media (max-width: 1080px) { .nav { display: none; } .ctrls { margin-left: auto; } }
@media (max-width: 1280px) { .mark-name { display: none; } }
@media (max-width: 720px) {
  .bar-in { gap: 6px; padding-block: 8px; }
  .mark { display: none; }
  .ctrls { margin-left: 0; width: 100%; justify-content: space-between; gap: 6px; }
  .ctrl-l { display: none; }
  .seg button { padding: 5px 8px; font-size: 12.5px; }
}
@media (max-width: 560px) {
  .kpi-top { flex-direction: column; gap: 1px; }
  .kpi-code { order: -1; font-size: 9.5px; }
  .kpi { padding: 12px 12px 10px; }
}

/* ---------- 标题区 ---------- */
.mast { padding-block: 36px 28px; display: grid; gap: 18px 36px; grid-template-columns: minmax(0, 1fr); }
.mast-l { display: grid; gap: 16px; align-content: center; min-width: 0; }
.mast .route, .mast .meta { grid-column: 1 / -1; }
.hero { margin: 0; display: grid; gap: 6px; min-width: 0; align-self: center; }
.hero { padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.hero-art svg { display: block; width: 100%; height: auto; }
.hero-cap { font-size: 11.5px; color: var(--muted); line-height: 1.5; max-width: 62ch; }

@media (max-width: 560px) { .hero-cap { font-size: 11px; } }
.eyebrow {
  font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center;
}
.eyebrow b { color: var(--accent); font-weight: 500; }
@media (min-width: 640px) { .eyebrow .ey-dup { display: none; } }
.thesis {
  font-family: var(--f-display); font-weight: 700; font-size: clamp(1.9rem, 1.3rem + 2vw, 2.9rem); line-height: 1.22;
  letter-spacing: -0.01em; max-width: 22em;
}
:lang(zh) .thesis, .thesis:lang(zh) { letter-spacing: 0.01em; }
.thesis-en { font-family: var(--f-display); font-weight: 600; font-size: var(--t-lg); color: var(--ink-2); max-width: 34em; line-height: 1.35; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--t-sm); color: var(--muted); }
.meta span { display: inline-flex; gap: 6px; align-items: baseline; }
.meta b { color: var(--ink-2); font-weight: 500; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .kpis { gap: 8px; } }
.kpi {
  background: var(--sheet); border: 1px solid var(--rule-soft); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px 12px; display: grid; gap: 6px; min-width: 0; align-content: start;
}
.kpi-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.kpi-l { font-size: var(--t-sm); color: var(--ink-2); font-weight: 500; line-height: 1.35; }
.kpi-code { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }
.kpi-v { font-size: clamp(1.6rem, 1.1rem + 1.6vw, 2.35rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.kpi-u { font-size: var(--t-sm); font-weight: 400; color: var(--muted); letter-spacing: 0; }
.kpi-sub { font-size: var(--t-xs); color: var(--muted); line-height: 1.4; min-height: 1.4em; }
.kpi-spark { height: 34px; margin-top: 2px; }
.kpi-spark svg { display: block; width: 100%; height: 34px; overflow: visible; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-xs); font-weight: 500; line-height: 1.2;
  padding: 3px 7px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip.good { color: var(--good); background: var(--good-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.flat { color: var(--ink-2); background: var(--wash); }
.chip svg { width: 9px; height: 9px; }
.kpi-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 22px; }
.kpi-cmp { font-size: var(--t-xs); color: var(--muted); }
.strip {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 12px;
  border: 1px solid var(--rule-soft); border-radius: var(--radius); background: var(--sheet-2);
}
.strip > div { padding: 10px 14px; display: grid; gap: 2px; min-width: 0; border-left: 1px solid var(--rule-soft); }
.strip > div:first-child { border-left: 0; }
.strip-l { font-size: var(--t-xs); color: var(--muted); }
.strip-v { font-size: var(--t-md); font-weight: 600; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.strip-v small { font-size: var(--t-xs); font-weight: 400; color: var(--muted); }
@media (max-width: 980px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip > div:nth-child(3) { border-left: 0; }
  .strip > div:nth-child(n+3) { border-top: 1px solid var(--rule-soft); }
}

/* ---------- 章节 ---------- */
main { padding-bottom: 40px; }
.sec { padding-block: 44px 8px; }
.sec-h { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: baseline; margin-bottom: 22px; border-top: 2px solid var(--ink); padding-top: 14px; }
.sec-n { font-family: var(--f-mono); font-size: var(--t-sm); color: var(--accent); font-weight: 500; letter-spacing: 0.06em; }
.sec-t { font-family: var(--f-display); font-size: var(--t-xl); font-weight: 700; line-height: 1.25; }
.sec-sub { grid-column: 2; color: var(--muted); font-size: var(--t-sm); max-width: 70ch; }
.sec-t .en-sub { display: block; font-size: var(--t-md); font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.en-sub { color: var(--muted); }
p.en-sub { font-size: 0.92em; margin-top: 6px; line-height: 1.6; }
.bi-sep { display: block; height: 0; }

.ov { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .ov { grid-template-columns: minmax(0, 1fr); } }
.lede { font-size: var(--t-md); line-height: 1.8; max-width: 68ch; }
.lede p + p { margin-top: 10px; }
.win-tag { display: inline-flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); margin-bottom: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
.win-tag i { width: 8px; height: 8px; border-radius: 2px; background: var(--brand); display: inline-block; }
.take { display: grid; gap: 0; border-left: 1px solid var(--rule); }
.take-i { padding: 2px 0 14px 16px; position: relative; }
.take-i::before { content: ""; position: absolute; left: -4px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--ink-2); }
.take-h { font-weight: 600; font-size: var(--t-base); line-height: 1.45; }
.take-b { font-size: var(--t-sm); color: var(--ink-2); margin-top: 3px; line-height: 1.6; }
.take-t { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 16px; }

sup.c { font-size: 0.68em; line-height: 0; margin-left: 1px; }
sup.c a {
  text-decoration: none; color: var(--s1); font-family: var(--f-mono); font-weight: 500; padding: 0 1px;
}
sup.c a:hover { text-decoration: underline; }

/* ---------- 卡片 / 图表 ---------- */
.card {
  background: var(--sheet); border: 1px solid var(--rule-soft); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 18px 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px;
}
.card-h { display: grid; gap: 3px; }
.card-t { font-weight: 600; font-size: var(--t-md); line-height: 1.35; }
.card-s { font-size: var(--t-xs); color: var(--muted); line-height: 1.5; }
.card-s .mono { letter-spacing: 0.02em; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid2 .wide { grid-column: 1 / -1; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.chart { position: relative; width: 100%; min-height: 120px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg text { font-family: var(--f-body); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-xs); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; border-radius: 2px; }
.legend i.dash { border-top-style: dashed; }
.legend i.box { width: 10px; height: 10px; border: 0; border-radius: 2px; }
.legend i.band { width: 14px; height: 10px; border: 0; background: var(--wash); outline: 1px solid var(--rule); border-radius: 2px; }
.sum { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--rule-soft); padding-top: 10px; align-items: center; }
.sum-i { display: grid; gap: 0; padding: 4px 10px; border-radius: 7px; border: 1px solid transparent; min-width: 0; }
.sum-i.on { border-color: var(--brand); background: var(--wash); }
.sum-k { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.04em; }
.sum-v { font-size: var(--t-sm); font-weight: 600; font-variant-numeric: tabular-nums; }
.sum-v small { font-weight: 400; color: var(--muted); }
.tbl-btn {
  margin-left: auto; font: inherit; font-size: var(--t-xs); color: var(--ink-2); background: transparent;
  border: 1px solid var(--rule); border-radius: 6px; padding: 4px 9px; cursor: pointer;
}
.tbl-btn:hover { background: var(--wash); color: var(--ink); }
.tbl-wrap { overflow-x: auto; }
table.dt { border-collapse: collapse; width: 100%; font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
table.dt th, table.dt td { padding: 5px 8px; border-bottom: 1px solid var(--rule-soft); text-align: right; white-space: nowrap; }
table.dt th:first-child, table.dt td:first-child { text-align: left; }
table.dt th { color: var(--muted); font-weight: 500; }

/* 图表内元素 */
.ax text { fill: var(--muted); font-size: 11px; }
.ax line, .ax path { stroke: var(--axis); }
.gl line { stroke: var(--grid); }
.ref line { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
.ref text { fill: var(--ink-2); font-size: 10.5px; }
.band { fill: var(--wash); }
.band-l { fill: var(--muted); font-size: 10.5px; font-family: var(--f-mono); letter-spacing: 0.04em; }
.ann line { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
.ann text { fill: var(--ink-2); font-size: 10.5px; }
.ann circle { fill: var(--sheet); stroke: var(--ink-2); stroke-width: 1.25; }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ln.dash { stroke-dasharray: 5 4; }
.ln.dim { opacity: 0.35; }
.area { opacity: 0.1; }
.dot { stroke: var(--sheet); stroke-width: 2; }
.end-l { font-size: 11px; font-weight: 600; fill: var(--ink); }
.end-l.m { fill: var(--muted); font-weight: 500; }
.bar-v { font-size: 11px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar-k { font-size: 12px; fill: var(--ink-2); }
.xh { stroke: var(--ink-2); stroke-width: 1; opacity: 0.55; pointer-events: none; }
.hit { fill: transparent; cursor: crosshair; }
.hit:focus { outline: none; }
.chart svg:focus-within .hit-ring { opacity: 1; }
.c-s1 { stroke: var(--s1); } .f-s1 { fill: var(--s1); }
.c-s2 { stroke: var(--s2); } .f-s2 { fill: var(--s2); }
.c-s3 { stroke: var(--s3); } .f-s3 { fill: var(--s3); }
.c-prev { stroke: var(--s-prev); } .f-prev { fill: var(--s-prev); }
.c-neg { stroke: var(--neg); } .f-neg { fill: var(--neg); }
.f-wash { fill: var(--wash); }
rect.b { transition: opacity 0.15s; }
rect.b.dim { opacity: 0.35; }
rect.b:hover, rect.b:focus { opacity: 0.85; outline: none; }
.hatch-l { stroke: var(--sheet); stroke-width: 2; }

#tip {
  position: fixed; z-index: 80; pointer-events: none; background: var(--sheet); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: var(--t-xs);
  min-width: 140px; max-width: 280px; opacity: 0; transform: translateY(4px); transition: opacity 0.12s, transform 0.12s;
}
#tip.on { opacity: 1; transform: none; }
#tip .tt-h { font-family: var(--f-mono); color: var(--muted); margin-bottom: 4px; letter-spacing: 0.03em; }
#tip .tt-r { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; line-height: 1.5; }
#tip .tt-r b { font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
#tip .tt-r span { color: var(--ink-2); }
#tip .tt-r i { display: block; width: 12px; height: 0; border-top: 2px solid; }

  const OVERVIEW = {
    gl: {
      Q1: { zh: '一季度呈现"前稳后急"。1–2月全球供应链压力温和，GSCPI 分别为0.36和0.49[[nyfed]]；Drewry WCI 在春节后连续七周回落，2月26日为每40英尺箱1,899美元[[drewry]]。政策面先变：2月20日美国最高法院以6比3裁定 IEEPA 不授权征收关税[[scotus]]，2月24日起改征为期150天的10%第122条款临时附加税[[sec122]]。2月28日中东战事爆发，霍尔木兹海峡日均通行由2月的78.3艘降至3月的3.2艘[[portwatch]]，3月布伦特均价升至103.13美元/桶[[eia-brent]]，IATA 航空货运需求同比下降4.8%，其中中东承运人下降54.3%[[iata]]。3月 GSCPI 为0.63，为2023年1月以来最高[[nyfed]]。', en: 'Q1 started calm and ended in crisis. Pressure was mild in January and February, with the GSCPI at 0.36 and 0.49 [[nyfed]], and the Drewry WCI fell for seven straight weeks after the Lunar New Year to $1,899 per 40ft on 26 February [[drewry]]. Policy moved first: on 20 February the US Supreme Court ruled 6–3 that IEEPA does not authorize tariffs [[scotus]], and a 150-day 10% Section 122 surcharge replaced those duties from 24 February [[sec122]]. War broke out on 28 February. Average daily transits through the Strait of Hormuz fell from 78.3 in February to 3.2 in March [[portwatch]], Brent averaged $103.13/bbl in March [[eia-brent]], and IATA air cargo demand fell 4.8% year on year, with Middle East carriers down 54.3% [[iata]]. The March GSCPI reading of 0.63 was the highest since January 2023 [[nyfed]].' },
      Q2: { zh: '二季度冲击见顶，随后开始被消化。4月8日宣布停火、4月13日美国对伊朗实施海上封锁[[hormuz]]，4月霍尔木兹日均通行仅7.1艘[[portwatch]]；布伦特均价升至117.29美元/桶，比上年同期高72%[[eia-brent]]。美国 LMI 运输价格分项4月达95.0、运力分项跌至28.4，两者差距创该指数纪录[[lmi]]。GSCPI 4、5月分别为1.78和1.81，为2022年7月以来最高[[nyfed]]。6月17日美伊签署谅解备忘录[[hormuz]]，6月布伦特回落至85.40美元/桶[[eia-brent]]，GSCPI 降至1.21[[nyfed]]。运价却逆势走高：旺季提前与绕行压力推动 Drewry WCI 由4月30日的2,216美元升至6月25日的4,166美元/FEU[[drewry]]。', en: 'The shock peaked in Q2 and then began to be absorbed. A ceasefire was declared on 8 April and a US naval blockade of Iran took effect on 13 April [[hormuz]]; Hormuz averaged only 7.1 transits a day in April [[portwatch]]. Brent averaged $117.29/bbl, 72% above a year earlier [[eia-brent]]. In the US Logistics Managers’ Index, transportation prices reached 95.0 in April while capacity fell to 28.4, the widest gap the index has recorded [[lmi]]. The GSCPI read 1.78 in April and 1.81 in May, the highest since July 2022 [[nyfed]]. After the US–Iran memorandum of understanding on 17 June [[hormuz]], Brent eased to $85.40 in June [[eia-brent]] and the GSCPI fell to 1.21 [[nyfed]]. Freight moved the other way: an early peak season and rerouting lifted the Drewry WCI from $2,216 on 30 April to $4,166 per 40ft on 25 June [[drewry]].' },
      Q3: { zh: '三季度，冲击从一次性事件变成反复发作。7月8日美伊临时协议破裂，7月15日美国恢复海上封锁[[hormuz]]，霍尔木兹三季度日均通行仅6.2艘[[portwatch]]；7月20日胡塞武装宣布对沙特实施海上禁运[[houthi]]，曼德海峡8月日均通行降至27.4艘，比6月低25%[[portwatch]]。布伦特均价由7月的83.76美元升至9月的114.16美元/桶[[eia-brent]]，GSCPI 9月回升至1.28[[nyfed]]。关税方面，第122条款附加税7月24日到期，第301条款对60个经济体加征10%或12.5%的新关税同日生效[[sec301]]；9月下旬中美元首在华盛顿会晤，美方称关税休战延长两个月，中方未确认[[xi-visit]]。需求仍有韧性：全球制造业PMI 9月升至53.0，为2022年2月以来最高[[spg-pmi]]；Drewry WCI 7月9日升至4,639美元后高位横盘，9月24日为4,468美元/FEU[[drewry]]。', en: 'In Q3 the shock turned from a one-off into a recurring one. The US–Iran interim deal collapsed on 8 July and the US reinstated its blockade on 15 July [[hormuz]]; Hormuz averaged just 6.2 transits a day in Q3 [[portwatch]]. On 20 July the Houthis announced a maritime embargo on Saudi Arabia [[houthi]], and Bab el-Mandeb traffic fell to 27.4 transits a day in August, 25% below June [[portwatch]]. Brent climbed from $83.76 in July to $114.16 in September [[eia-brent]], and the GSCPI rose back to 1.28 [[nyfed]]. On tariffs, the Section 122 surcharge expired on 24 July and new Section 301 duties of 10% or 12.5% on 60 economies took effect the same day [[sec301]]; after the late-September Trump–Xi meeting in Washington the US said the tariff truce would run two more months, which China has not confirmed [[xi-visit]]. Demand held: the global manufacturing PMI rose to 53.0 in September, the highest since February 2022 [[spg-pmi]], and the Drewry WCI peaked at $4,639 on 9 July before moving sideways to $4,468 per 40ft on 24 September [[drewry]].' },
      H1: { zh: '2026年上半年，全球供应链经历了2022年以来最剧烈的一次压力回升。2月28日美以对伊朗的打击导致霍尔木兹海峡关闭，IMF PortWatch 记录的日均通行船舶由2月的78.3艘降至3月的3.2艘[[portwatch]]；布伦特月均价4月升至117.29美元/桶[[eia-brent]]；纽约联储 GSCPI 由1月的0.36升至5月的1.81，6月回落至1.21[[nyfed]]。需求端没有随之崩塌：J.P.摩根全球制造业PMI 上半年每个月都在50以上[[spg-pmi]]，WTO 统计上半年全球货物贸易量增长3.5%、贸易额增长约15%，AI 相关商品贡献了47%的增长[[wto-oct]]。上半年的主线是供给冲击与结构性需求叠加：成本和时效承压，贸易量保持韧性。', en: 'In the first half of 2026, global supply chains went through their sharpest rise in pressure since 2022. US–Israeli strikes on Iran on 28 February closed the Strait of Hormuz, and IMF PortWatch shows daily transits falling from 78.3 in February to 3.2 in March [[portwatch]]. Brent averaged $117.29/bbl in April [[eia-brent]]. The New York Fed GSCPI climbed from 0.36 in January to 1.81 in May before easing to 1.21 in June [[nyfed]]. Demand held up: the J.P.Morgan Global Manufacturing PMI stayed above 50 every month [[spg-pmi]], and the WTO estimates first-half goods trade grew 3.5% by volume and about 15% by value, with AI-related goods accounting for 47% of the growth [[wto-oct]]. The half was defined by a supply shock layered on structural demand: costs and lead times came under strain while trade volumes held.' },
      M9: { zh: '2026年前三季度，全球供应链在一场持续的能源与航道冲击中运行。霍尔木兹海峡2月28日关闭后只在6月下旬至7月初短暂部分恢复，前三季度日均通行19.8艘，上年同期为90.5艘[[portwatch]]；布伦特均价93.27美元/桶，比上年同期高31.5%[[eia-brent]]；GSCPI 九个月均值1.08，上年同期为−0.10[[nyfed]]。需求端持续扩张：全球制造业PMI 九个月全部高于50，9月达53.0[[spg-pmi]]；WTO 把2026年货物贸易量增速预测由3月的1.9%上调至3.9%[[wto-oct]]。成本、时效与政策不确定性同步上升，构成前三季度的主线。', en: 'Through the first nine months of 2026, global supply chains ran through a prolonged energy and shipping-lane shock. The Strait of Hormuz, closed on 28 February, partly reopened only from late June to early July; it averaged 19.8 transits a day over Jan–Sep against 90.5 a year earlier [[portwatch]]. Brent averaged $93.27/bbl, 31.5% higher [[eia-brent]], and the GSCPI averaged 1.08 against −0.10 a year earlier [[nyfed]]. Demand kept expanding: the global manufacturing PMI was above 50 in all nine months and reached 53.0 in September [[spg-pmi]], and the WTO raised its 2026 goods-volume forecast from 1.9% in March to 3.9% [[wto-oct]]. Rising costs, longer lead times and policy uncertainty, all at once, were the thread running through the period.' }
    },
    cn: {
      Q1: { zh: '一季度开局偏强。社会物流总额96.4万亿元，同比增长6.2%，社会物流总费用与GDP的比率为14.0%[[cflp-q1]]；货物进出口11.84万亿元，海关10月修订后的同比增速为15.3%[[customs-9m]]，电动汽车、锂电池、风电机组出口分别增长77.5%、50.4%和45.2%[[customs-q1]]。春节假期延长且全部落在2月中下旬，2月制造业PMI降至49.0%[[nbs-pmi]]，物流业景气指数降至47.5%[[cflp-lpi]]，3月双双回到扩张区间。中东战事首先冲击远洋运价：3月上海至波斯湾基本港即期运价月均3,140美元/TEU，环比上涨192.2%[[mot-freight]]。', en: 'Q1 got off to a strong start. Total social logistics value reached 96.4 trillion yuan, up 6.2%, and logistics costs were 14.0% of GDP [[cflp-q1]]. Goods trade totalled 11.84 trillion yuan, up 15.3% on customs’ October revision [[customs-9m]], with exports of electric vehicles, lithium batteries and wind turbines up 77.5%, 50.4% and 45.2% [[customs-q1]]. A longer Spring Festival holiday fell entirely in mid-to-late February, pulling the manufacturing PMI down to 49.0% [[nbs-pmi]] and the logistics prosperity index to 47.5% [[cflp-lpi]]; both returned to expansion in March. The Middle East war hit ocean freight first: the March spot rate from Shanghai to Persian Gulf base ports averaged $3,140/TEU, up 192.2% month on month [[mot-freight]].' },
      Q2: { zh: '二季度增速换挡、结构分化。社会物流总额同比增长4.4%，比一季度低1.8个百分点[[cflp-h1]]；GDP 增长4.3%[[nbs-gdp]]。外贸逆势加速，二季度进出口13.61万亿元[[customs-h1]]，修订后同比增长18.3%[[customs-9m]]。制造业PMI 4–6月均在50以上，6月新订单指数回升至51.2%[[nbs-pmi]]。运价同步走高：SCFI 6月月均3,018点，环比上涨35.9%[[mot-freight]]；物流企业主营业务成本指数2026年以来一直高于52%[[cflp-lpi]]。', en: 'Q2 brought slower growth and sharper divergence. Total social logistics value rose 4.4%, 1.8 points slower than in Q1 [[cflp-h1]], and GDP grew 4.3% [[nbs-gdp]]. Trade accelerated: Q2 goods trade reached 13.61 trillion yuan [[customs-h1]], up 18.3% on the revised series [[customs-9m]]. The manufacturing PMI stayed above 50 from April to June, and the new orders index rose to 51.2% in June [[nbs-pmi]]. Freight rates climbed too: the SCFI averaged 3,018 points in June, up 35.9% month on month [[mot-freight]], and the logistics firms’ operating cost index has stayed above 52% throughout 2026 [[cflp-lpi]].' },
      Q3: { zh: '三季度外需进一步走强，内需仍偏弱。三季度进出口同比增长22.3%，出口规模首次超过8万亿元、增长22%；9月进出口5.16万亿元，同比增长27.5%[[customs-9m]]。三季度GDP增长4.5%，比二季度回升0.2个百分点[[nbs-gdp9]]。制造业PMI 7月降至49.2%，8、9月连续回升，9月为50.1%[[nbs-pmi]]；物流业景气指数9月升至51.5%，新订单指数连续7个月回升[[cflp-lpi]]。运价维持高位：SCFI 三季度均值3,406点，是上年同期的2.3倍；上海至波斯湾即期运价9月为6,353美元/TEU[[mot-freight]]。中物联前三季度社会物流数据截至10月20日尚未发布。', en: 'In Q3 external demand strengthened further while domestic demand stayed soft. Q3 goods trade grew 22.3%, with exports above 8 trillion yuan for the first time, up 22%; September trade reached 5.16 trillion yuan, up 27.5% [[customs-9m]]. Q3 GDP grew 4.5%, 0.2 points faster than Q2 [[nbs-gdp9]]. The manufacturing PMI fell to 49.2% in July, then rose in August and September to 50.1% [[nbs-pmi]]; the logistics prosperity index reached 51.5% in September, with new orders up for a seventh straight month [[cflp-lpi]]. Freight stayed expensive: the Q3 average SCFI of 3,406 points was 2.3 times the level a year earlier, and the Shanghai–Persian Gulf spot rate hit $6,353/TEU in September [[mot-freight]]. CFLP had not published Jan–Sep social logistics data as of 20 October.' },
      H1: { zh: '2026年上半年，中国供应链在外部冲击中保持了量稳、价升、结构优化。中物联数据显示，上半年社会物流总额181.1万亿元，同比增长5.1%，高于同期GDP增速0.4个百分点；社会物流总费用与GDP的比率为13.9%，比上年同期低0.1个百分点[[cflp-h1]]。货物进出口25.47万亿元，同比增长16.9%，上半年规模首次超过25万亿元；进口增长22.1%，快于出口8.7个百分点[[customs-h1]]。WTO 指出，全球贸易额增速明显高于贸易量，主要受燃料和数据中心电子产品价格上涨推动[[wto-oct]]。制造业PMI 1–2月低于临界点，3–6月持续扩张[[nbs-pmi]]；SCFI 二季度均值较上年同期高42.3%[[mot-freight]]。', en: 'In the first half of 2026, China’s supply chains held volumes steady while prices rose and the structure improved. CFLP data show total social logistics value of 181.1 trillion yuan, up 5.1%, 0.4 points faster than GDP, with logistics costs down 0.1 point year on year to 13.9% of GDP [[cflp-h1]]. Goods trade reached 25.47 trillion yuan, up 16.9%, the first half above 25 trillion on record; imports grew 22.1%, 8.7 points faster than exports [[customs-h1]]. The WTO notes that trade values grew far faster than volumes worldwide, driven by higher prices for fuels and data-centre electronics [[wto-oct]]. The manufacturing PMI was below 50 in January and February and in expansion from March to June [[nbs-pmi]]; the Q2 average SCFI was 42.3% higher than a year earlier [[mot-freight]].' },
      M9: { zh: '2026年前三季度，中国供应链在外需走强、内需偏弱中运行。货物进出口39.94万亿元，同比增长18.8%，为近5年同期最快，且逐季加速（15.3%、18.3%、22.3%）；进口增长22.3%，快于出口5.9个百分点[[customs-9m]]。GDP 增长4.6%[[nbs-gdp9]]。结构上，集成电路出口增长99.1%，电动汽车出口增长72.3%，集成电路进口增长56.6%，存储部件进口增长1.5倍[[customs-9m]]。物流需求的最新完整读数仍是上半年：社会物流总额增长5.1%，物流费用与GDP的比率为13.9%[[cflp-h1]]。SCFI 前三季度均值比上年同期高48.0%[[mot-freight]]。', en: 'Over Jan–Sep 2026, China’s supply chains ran on strong external demand and soft domestic demand. Goods trade reached 39.94 trillion yuan, up 18.8%, the fastest for the period in five years, and accelerated each quarter (15.3%, 18.3%, 22.3%); imports grew 22.3%, 5.9 points faster than exports [[customs-9m]]. GDP grew 4.6% [[nbs-gdp9]]. By product, integrated-circuit exports rose 99.1%, EV exports 72.3%, integrated-circuit imports 56.6%, and memory-component imports grew 1.5-fold [[customs-9m]]. The latest complete reading of logistics demand is still the first half: social logistics value up 5.1%, logistics costs at 13.9% of GDP [[cflp-h1]]. The Jan–Sep average SCFI was 48.0% above a year earlier [[mot-freight]].' }

  function drawCost(el) {
    const W = Math.max(280, el.clientWidth || 500); const m = { l: 16, r: 16, t: 16 }; const iw = W - m.l - m.r;
    const lo = 13.4; const hi = 14.1; const xs = (v) => m.l + ((hi - v) / (hi - lo)) * iw; // 越低越靠右
    const yL = m.t + 34; const H = yL + 46;
    const lab = (x, y, t, anchor, strong) => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="bar-v" style="${strong ? 'font-weight:600;fill:var(--ink)' : ''}">${esc(t)}</text>`;
    let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(L({ zh: '物流费用与GDP比率走势', en: 'Logistics cost to GDP path' }))}">`;
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${yL}" y2="${yL}" style="stroke:var(--grid);stroke-width:6;stroke-linecap:round"/>`;
    g += `<line x1="${xs(14.0)}" x2="${xs(13.9)}" y1="${yL}" y2="${yL}" style="stroke:var(--s1);stroke-width:6;stroke-linecap:round"/>`;
    g += `<line x1="${xs(13.9) + 8}" x2="${xs(13.5) - 8}" y1="${yL}" y2="${yL}" style="stroke:var(--s3);stroke-width:2;stroke-dasharray:4 4"/>`;
    [14.0, 13.8, 13.6, 13.4].forEach((v) => { g += `<g class="ax"><line x1="${xs(v)}" x2="${xs(v)}" y1="${yL + 7}" y2="${yL + 12}"/><text x="${xs(v)}" y="${yL + 26}" text-anchor="middle">${fmt(v)}%</text></g>`; });
    g += `<circle class="dot f-s1" cx="${xs(14.0)}" cy="${yL}" r="5"/><circle class="dot f-s1" cx="${xs(13.9)}" cy="${yL}" r="5"/><circle class="dot f-s3" cx="${xs(13.5)}" cy="${yL}" r="6"/>`;
    g += lab(xs(14.0) - 4, m.t, L({ zh: '一季度 14.0%', en: 'Q1 14.0%' }), 'start', true);
    g += lab(xs(13.9) - 4, m.t + 16, L({ zh: '上半年 13.9%', en: 'H1 13.9%' }), 'start', true);
    g += lab(xs(13.5) + 6, m.t, L({ zh: '2027年目标 13.5%', en: '2027 target 13.5%' }), 'end', true);
    g += lab((xs(13.9) + xs(13.5)) / 2 + 20, yL - 8, L({ zh: '还差 0.4pt', en: '0.4pt to go' }), 'middle', false);
    g += '</svg>';
    el.innerHTML = g + `<p class="card-s" style="margin-top:6px">${withCites(L({ zh: '一季度为14.0%，上半年13.9%，比上年同期低0.1个百分点[[cflp-h1]]；《行动方案》提出到2027年力争降至13.5%左右[[cost-plan]]。', en: 'Q1 was 14.0% and H1 13.9%, 0.1 point lower than a year earlier [[cflp-h1]]; the action plan aims for about 13.5% by 2027 [[cost-plan]].' }))}</p>`;
  }

    let h = secHead('07', { zh: '数据来源与方法', en: 'Sources and methodology' }, { zh: `共 ${R.SOURCES.length} 项来源，按编号与正文引注对应。所有链接于2026年10月20日检索。`, en: `${R.SOURCES.length} sources, numbered to match the citations. All links retrieved on 20 October 2026.` });
    groups.forEach(([g, gl]) => {
      h += `<div class="src-g"><h3>${bx(gl)}</h3><div class="tbl-wrap"><table class="st"><tbody>` + R.SOURCES.filter((s) => s.g === g).map((s) => `<tr id="src-${s.id}"><td class="n">${SRC_N[s.id]}</td><td class="o">${tx(s.org)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${tx(s.title)}</a>${s.extra ? `<span class="extra">${s.extra.map((x) => `<a href="${esc(x[1])}" target="_blank" rel="noopener">${esc(isEn() ? (EXL[x[0]] || (/^\d+月$/.test(x[0]) ? MON.en[parseInt(x[0], 10) - 1] : x[0])) : x[0])}</a>`).join('')}</span>` : ''}</td><td class="dd">${esc(s.date)}</td><td class="k"><span class="kind ${s.kind}">${tx(KIND[s.kind])}</span></td></tr>`).join('') + '</tbody></table></div></div>';
    });
    h += `<div class="src-g"><h3>${isEn() ? 'Methodology notes' : '方法说明'}</h3><ol class="method">${R.METHOD.map((m) => `<li>${bx(m, true)}</li>`).join('')}</ol></div>`;
    document.getElementById('sources').innerHTML = h;
  }

  /* ---------- 交互绑定 ---------- */
  // 统一的滚动跳转：平滑滚动未到位时直接跳到目标，保证在任何宿主环境都能到达
  function goTo(el, center) {
    if (!el) return;
    const barH = (document.getElementById('bar') || {}).offsetHeight || 0;
    const r = el.getBoundingClientRect();
    const top = Math.max(0, center ? r.top + window.scrollY - (window.innerHeight - r.height) / 2 : r.top + window.scrollY - barH - 10);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top, behavior: reduce ? 'auto' : 'smooth' });
    setTimeout(() => {
      const maxY = document.documentElement.scrollHeight - window.innerHeight;
      if (Math.abs(window.scrollY - Math.min(top, maxY)) > 4) window.scrollTo({ top, behavior: 'auto' });
    }, 900);
  }
  function bindCites(root) {
    (root || document).querySelectorAll('sup.c a').forEach((a) => a.addEventListener('click', (ev) => {
      const row = document.getElementById('src-' + a.dataset.src); if (!row) return;
      ev.preventDefault(); goTo(row, true);
      row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 1600);
    }));
  }
  function bindTables(root) {
    (root || document).querySelectorAll('.tbl-btn').forEach((b) => b.addEventListener('click', () => {
      const t = document.getElementById(b.dataset.tbl + '-t'); if (!t) return;
      const open = t.hidden; t.hidden = !open; b.setAttribute('aria-expanded', String(open)); b.textContent = open ? L(U.hideTable) : L(U.table);
    }));
  }
  let spyObs = null;
  function spy() {
    if (spyObs) spyObs.disconnect();
    if (!('IntersectionObserver' in window)) return;
    spyObs = new IntersectionObserver((ents) => {
      ents.forEach((en) => { if (en.isIntersecting) { document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('on', a.dataset.nav === en.target.id)); } });
    }, { rootMargin: '-40% 0px -55% 0px' });
    U.nav.forEach(([id]) => { const s = document.getElementById(id); if (s) spyObs.observe(s); });
  }

  function renderAll(anim) {
    charts.length = 0;
    document.documentElement.lang = isEn() ? 'en' : 'zh-CN';
    document.body.classList.toggle('bi', isBi());
    document.title = isEn() ? 'Supply Chain Report 2026' : '2026供应链行业报告';
    renderBar(); renderMast(); renderOverview(); renderNews(); renderMarket(); renderCisce(); renderTopics(); renderTrends(); renderSources();
    document.getElementById('foot').innerHTML = `<p>${isEn() ? 'Compiled with AI-assisted research on 20 October 2026. Every figure links to a public source; check the original release before citing. Values marked "derived" are calculated from official totals.' : '本报告于2026年10月20日在 AI 辅助下检索整理。每个数字均链接到公开来源，引用前请以原始发布为准；标注"推算"的数值由官方累计值计算得出。'}</p><p>${isEn() ? 'Report content is licensed under <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>; code under the MIT License. Third-party data and quotations remain with their original publishers.' : '报告内容采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hans" target="_blank" rel="noopener">CC BY-NC 4.0</a> 许可，代码采用 MIT 许可；第三方数据与引文的权利归原发布方。'}</p><p class="mono">SCR · 26 · ${R.SOURCES.length} ${isEn() ? 'sources' : '项来源'}</p>`;
    bindCites(); bindTables();
    if (anim && !matchMedia('(prefers-reduced-motion: reduce)').matches) { document.querySelectorAll('#top, main > section').forEach((s) => { s.classList.remove('fade'); void s.offsetWidth; s.classList.add('fade'); }); }
  }

  renderAll(false);

  // 英文网页字体（约 240 KB）在页面渲染之后再加载：Google Fonts 连不上时页面照常用系统字体显示，不会等待超时
  const FONT_CSS = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap';
  const loadFonts = () => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = FONT_CSS; document.head.appendChild(l); };
  if (document.readyState === 'complete') setTimeout(loadFonts, 0); else window.addEventListener('load', loadFonts, { once: true });
})();

</script>
